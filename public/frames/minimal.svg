<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- subtle dark underlay so the white line stays visible on light photos -->
  <rect x="28" y="28" width="1024" height="1024" fill="none" stroke="#000000" stroke-width="18" opacity="0.22"/>
  <!-- thin white main line -->
  <rect x="28" y="28" width="1024" height="1024" fill="none" stroke="#FFFFFF" stroke-width="8"/>

  <!-- gold corner accents (L shapes), clear of the border -->
  <g fill="none" stroke="#D4AF37" stroke-width="16">
    <path d="M66,146 L66,66 L146,66"/>
    <path d="M934,66 L1014,66 L1014,146"/>
    <path d="M66,934 L66,1014 L146,1014"/>
    <path d="M934,1014 L1014,1014 L1014,934"/>
  </g>
</svg>
