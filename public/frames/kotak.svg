<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="kotakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- main rounded border, blue-purple gradient -->
  <rect x="46" y="46" width="988" height="988" rx="150" fill="none" stroke="url(#kotakGrad)" stroke-width="42"/>

  <!-- thin inner accent line -->
  <rect x="112" y="112" width="856" height="856" rx="108" fill="none" stroke="#DDD6FE" stroke-width="6"/>

  <!-- corner ornaments: small dots just inside the corners -->
  <g stroke="#FFFFFF" stroke-width="5">
    <circle cx="168" cy="168" r="22" fill="#4F46E5"/>
    <circle cx="912" cy="168" r="22" fill="#A855F7"/>
    <circle cx="168" cy="912" r="22" fill="#A855F7"/>
    <circle cx="912" cy="912" r="22" fill="#4F46E5"/>
  </g>
</svg>
